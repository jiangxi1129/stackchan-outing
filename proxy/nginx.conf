# Plain HTTP on purpose: the ESP32 firmware speaks HTTP through the phone's CONNECT proxy, so no redirect to https here.
# Add a separate 443 server only if your firmware has a working TLS client.
server {
    listen 80;
    server_name robot.example.com;

    client_max_body_size 8m;
    location /q/ {
        proxy_pass http://127.0.0.1:18760;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    # Anything else: close the connection without an answer (nginx 444).
    location / { return 444; }
}

