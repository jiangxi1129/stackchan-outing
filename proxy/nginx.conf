server {
    listen 443 ssl http2;
    server_name robot.example.com;
    # Add your own certificate directives here.

    client_max_body_size 8m;
    location /q/ {
        proxy_pass http://127.0.0.1:18760;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}

